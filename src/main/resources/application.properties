spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=jdbc:postgresql://localhost:5432/oth_nest_db

#server authentication credentials
spring.datasource.username=postgres
spring.datasource.password=801410

#control table syncing strategies (automatically creates/updates columns)
spring.jpa.hibernate.ddl-auto=update

#not execute data.sql
spring.sql.init.mode=never

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=false

#upload limits, keep in sync with PHOTO_SIZE_MAX in ValidationLimits.java and frontend/src/app/utils/validation.ts
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=10MB

#offer photos: folder they are saved in, and the address the browser loads them from
#set them per machine without editing this file, with environment variables or program arguments:
#  Windows (PowerShell):  $env:APP_UPLOADS_DIR = "C:\oth-nest\uploads"
#  Linux/macOS (bash):    export APP_UPLOADS_DIR=/var/lib/oth-nest/uploads
#  any system:            --app.uploads.dir=...   (IntelliJ: Run configuration > Program arguments)
#the folder works on Windows and Linux/macOS: / and \ are both accepted, ~ is the user's home folder,
#a relative folder (default "uploads") starts where the backend is launched, i.e. the project root
#inside THIS file "\" is an escape character, so write C:/oth-nest/uploads or C:\\oth-nest\\uploads here
#the path of the url ("/uploads") is where the backend serves the folder
app.uploads.dir=${APP_UPLOADS_DIR:uploads}
app.uploads.url=${APP_UPLOADS_URL:http://localhost:8080/uploads}

#unexpected errors (500) carry the exception type and message, so the frontend can show the real cause
#this exposes internal error text to the browser, switch it off before deploying publicly
server.error.include-message=always
server.error.include-exception=true
