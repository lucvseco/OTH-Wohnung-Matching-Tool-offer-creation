#local profile without PostgreSQL: in-memory H2 database (data is lost on restart)
#run with: .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=h2"   (Windows)
#     or:   ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2          (Linux/macOS)
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:othnest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

#seed dummy users from data.sql after Hibernate creates the tables
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

#browser console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
